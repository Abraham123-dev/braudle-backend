version: '3.9'

services:
  backend:
    build: .
    ports:
      - '5000:5000'
    env_file: .env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./src:/app/src
    environment:
      - NODE_ENV=development

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
